name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"          # only rebuild when server code changes
  workflow_dispatch:         # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devpulse-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to GHCR

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./server        # Dockerfile lives in /server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha    # GitHub Actions cache — speeds up repeat builds
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        if: success()
        run: |
          curl -fsSL \
            -X GET \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
        # Set COOLIFY_WEBHOOK_URL in repo Settings → Secrets → Actions
        # Get the URL from Coolify: service → Webhooks → "Deploy Webhook"
